<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Embodied AI architecture map</title>
  <desc id="desc">Four research tracks from observations and task conditions to policies, actions, and feedback.</desc>
