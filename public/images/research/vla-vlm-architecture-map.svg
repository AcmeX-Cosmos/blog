<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">VLM and VLA architecture map</title>
  <desc id="desc">A pipeline from visual encoders through multimodal connectors and language backbones to four action head families.</desc>
  <rect width="1440" height="760" fill="#111315"/>
  <text x="72" y="76" fill="#f5f6f7" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700">VLM to VLA: Interface Stack</text>
  <text x="72" y="116" fill="#a7afb7" font-family="Inter, Arial, sans-serif" font-size="18">The architecture changes at the connector, temporal backbone, and action representation.</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="72" y="184" width="260" height="150" rx="6" fill="#17222c" stroke="#4ea1ff"/>
    <text x="98" y="220" fill="#4ea1ff" font-size="14" font-weight="700">VISUAL ENCODER</text>
    <text x="98" y="260" fill="#f5f6f7" font-size="25" font-weight="650">CLIP / DINOv2</text>
    <text x="98" y="294" fill="#a7afb7" font-size="16">Global semantics</text>
    <text x="98" y="317" fill="#a7afb7" font-size="16">Dense spatial features</text>
    <path d="M332 259H388" stroke="#59636d" stroke-width="3"/><path d="m388 259-12-8v16z" fill="#59636d"/>
    <rect x="408" y="184" width="260" height="150" rx="6" fill="#18251f" stroke="#4fc38a"/>
    <text x="434" y="220" fill="#4fc38a" font-size="14" font-weight="700">MULTIMODAL CONNECTOR</text>
    <text x="434" y="260" fill="#f5f6f7" font-size="24" font-weight="650">Projector / Q-Former</text>
    <text x="434" y="294" fill="#a7afb7" font-size="16">Cross-attention</text>
    <text x="434" y="317" fill="#a7afb7" font-size="16">Visual token resampling</text>
    <path d="M668 259H724" stroke="#59636d" stroke-width="3"/><path d="m724 259-12-8v16z" fill="#59636d"/>
    <rect x="744" y="184" width="260" height="150" rx="6" fill="#292218" stroke="#e8ad4f"/>
    <text x="770" y="220" fill="#e8ad4f" font-size="14" font-weight="700">LANGUAGE BACKBONE</text>
    <text x="770" y="260" fill="#f5f6f7" font-size="25" font-weight="650">LLaMA / PaLM / Qwen</text>
    <text x="770" y="294" fill="#a7afb7" font-size="16">Instruction and context</text>
    <text x="770" y="317" fill="#a7afb7" font-size="16">Autoregressive reasoning</text>
    <path d="M1004 259H1060" stroke="#59636d" stroke-width="3"/><path d="m1060 259-12-8v16z" fill="#59636d"/>
    <rect x="1080" y="184" width="288" height="150" rx="6" fill="#2a1c1b" stroke="#f27c71"/>
    <text x="1106" y="220" fill="#f27c71" font-size="14" font-weight="700">TEMPORAL POLICY</text>
    <text x="1106" y="260" fill="#f5f6f7" font-size="25" font-weight="650">State + observation history</text>
    <text x="1106" y="294" fill="#a7afb7" font-size="16">Action horizon</text>
    <text x="1106" y="317" fill="#a7afb7" font-size="16">Closed-loop conditioning</text>

    <text x="72" y="410" fill="#7f8993" font-size="14" font-weight="700">ACTION HEAD FAMILIES</text>
    <rect x="72" y="438" width="300" height="178" rx="6" fill="#181b1e" stroke="#30363c"/>
    <rect x="72" y="438" width="8" height="178" fill="#4ea1ff"/>
    <text x="104" y="479" fill="#4ea1ff" font-size="14" font-weight="700">DISCRETE TOKENS</text>
    <text x="104" y="519" fill="#f5f6f7" font-size="24" font-weight="650">RT-1 / RT-2 / OpenVLA</text>
    <text x="104" y="553" fill="#a7afb7" font-size="16">Quantize each action dimension</text>
    <text x="104" y="578" fill="#a7afb7" font-size="16">Train with next-token prediction</text>

    <rect x="404" y="438" width="300" height="178" rx="6" fill="#181b1e" stroke="#30363c"/>
    <rect x="404" y="438" width="8" height="178" fill="#4fc38a"/>
    <text x="436" y="479" fill="#4fc38a" font-size="14" font-weight="700">ACTION CHUNKS</text>
    <text x="436" y="519" fill="#f5f6f7" font-size="24" font-weight="650">ACT / Octo</text>
    <text x="436" y="553" fill="#a7afb7" font-size="16">Predict a future sequence</text>
    <text x="436" y="578" fill="#a7afb7" font-size="16">Reduce compounding error</text>

    <rect x="736" y="438" width="300" height="178" rx="6" fill="#181b1e" stroke="#30363c"/>
    <rect x="736" y="438" width="8" height="178" fill="#e8ad4f"/>
    <text x="768" y="479" fill="#e8ad4f" font-size="14" font-weight="700">DIFFUSION</text>
    <text x="768" y="519" fill="#f5f6f7" font-size="24" font-weight="650">Diffusion Policy / RDT</text>
    <text x="768" y="553" fill="#a7afb7" font-size="16">Denoise a continuous trajectory</text>
    <text x="768" y="578" fill="#a7afb7" font-size="16">Preserve multimodal actions</text>

    <rect x="1068" y="438" width="300" height="178" rx="6" fill="#181b1e" stroke="#30363c"/>
    <rect x="1068" y="438" width="8" height="178" fill="#f27c71"/>
    <text x="1100" y="479" fill="#f27c71" font-size="14" font-weight="700">FLOW / FREQUENCY</text>
    <text x="1100" y="519" fill="#f5f6f7" font-size="24" font-weight="650">PI-0 / FAST</text>
    <text x="1100" y="553" fill="#a7afb7" font-size="16">Continuous vector fields</text>
    <text x="1100" y="578" fill="#a7afb7" font-size="16">Compressed action tokens</text>
  </g>
  <text x="72" y="694" fill="#f5f6f7" font-family="Inter, Arial, sans-serif" font-size="17">VLM = perception and language alignment</text>
  <text x="520" y="694" fill="#f5f6f7" font-family="Inter, Arial, sans-serif" font-size="17">VLA = temporal state + an executable action representation</text>
  <text x="72" y="728" fill="#7f8993" font-family="Inter, Arial, sans-serif" font-size="14">Original study diagram · model names belong to their respective authors</text>
</svg>
